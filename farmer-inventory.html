<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy Farmers - Inventory & Harvests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a', farmyellow: '#f59e0b', machblue: '#0284c7' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative pb-16 overflow-hidden flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-farmgreen text-white p-4 rounded-b-3xl shadow-md flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='farmer-dashboard.html'" class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-xl transition">
                    <i class="fas fa-arrow-left text-xs"></i>
                </button>
                <div>
                    <h2 class="font-bold text-base"><i class="fas fa-boxes mr-1.5"></i>My Inventory</h2>
                    <p class="text-green-100 text-[10px]">Manage your farm harvests & listings</p>
                </div>
            </div>
            <!-- 🌐 Language Switcher -->
            <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-white/20 text-white border border-white/30 rounded-lg px-2 py-1 text-xs font-bold outline-none cursor-pointer">
                <option value="en" class="text-gray-900">EN</option>
                <option value="hi" class="text-gray-900">HI</option>
                <option value="kn" class="text-gray-900">KN</option>
            </select>
        </header>

        <!-- Main Content Container -->
        <div class="p-4 space-y-4">
            
            <!-- Actions Bar -->
            <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100">
                <div>
                    <h3 class="font-extrabold text-xs text-gray-900 uppercase">Active Harvests</h3>
                    <p id="listingCount" class="text-[10px] text-gray-400">Loading listings...</p>
                </div>
                <button onclick="openAddModal()" class="bg-farmgreen text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-sm hover:bg-green-700 transition flex items-center">
                    <i class="fas fa-plus mr-1.5"></i> New Listing
                </button>
            </div>

            <!-- Categories & Harvests Grid -->
            <div id="categoryGrid" class="grid grid-cols-2 gap-3">
                <p class="text-xs text-gray-400 italic col-span-2 text-center py-8">Loading inventory categories...</p>
            </div>

            <!-- Product Feed Container -->
            <div id="productView" class="hidden space-y-3">
                <div class="flex justify-between items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <button onclick="showCategories()" class="text-xs font-bold text-farmgreen bg-green-50 px-3 py-1.5 rounded-xl"><i class="fas fa-arrow-left mr-1.5"></i> Back</button>
                    <h3 id="activeCategoryTitle" class="font-extrabold text-gray-900 text-xs uppercase">Category</h3>
                </div>
                <div id="productGrid" class="space-y-3"></div>
            </div>
        </div>

        <!-- ➕ NEW LISTING MODAL -->
        <div id="addModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-extrabold text-lg text-gray-900">Add New Harvest Listing</h3>
                    <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <form id="addListingForm" class="space-y-3.5" onsubmit="submitNewListing(event)">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Category</label>
                        <select id="listingCategory" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-farmgreen">
                            <option value="Vegetables">Vegetables</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Grains">Grains</option>
                            <option value="Spices">Spices</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Crop / Produce Name</label>
                        <input type="text" id="cropName" required placeholder="e.g., Organic Red Tomatoes" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-farmgreen">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">Total Yield (kg)</label>
                            <input type="number" id="cropYield" required placeholder="500" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-farmgreen">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-600 mb-1">Expected Price (₹/kg)</label>
                            <input type="number" id="cropPrice" required placeholder="30" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-farmgreen">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Estimated Harvest Date</label>
                        <input type="date" id="harvestDate" required class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-farmgreen">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Product Photo (Attach from Gallery)</label>
                        <input type="file" id="cropPhotoFile" accept="image/*" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-green-50 file:text-farmgreen hover:file:bg-green-100">
                        <p class="text-[10px] text-gray-400 mt-1">If not uploaded, an AI-curated crop image will be assigned automatically.</p>
                    </div>
                    <button type="submit" class="w-full bg-farmgreen text-white font-bold py-3.5 rounded-2xl shadow-md transition hover:bg-green-700 mt-2">Publish Harvest Listing</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Application Config & Logic -->
    <script src="./config.js"></script>
    <script>
        const translations = {
            en: { title: "My Inventory" },
            hi: { title: "मेरी इन्वेंटरी" },
            kn: { title: "ನನ್ನ ದಾಸ್ತಾನು" }
        };

        function changeLanguage(langCode) {
            localStorage.setItem('frendzy_lang', langCode);
            if(document.getElementById('langSwitcher')) document.getElementById('langSwitcher').value = langCode;
        }
        document.addEventListener("DOMContentLoaded", () => { 
            changeLanguage(localStorage.getItem('frendzy_lang') || 'en'); 
            loadInventoryData();
        });

        let currentUser = JSON.parse(localStorage.getItem('frendzy_user') || 'null');
        if (!currentUser || currentUser.role !== 'FARMER') {
            window.location.href = 'farmer-dashboard.html';
        }

        let globalCategories = [];
        let farmerCrops = [];

        async function loadInventoryData() {
            try {
                const catRes = await fetch(`${API_BASE_URL}/api/admin/categories?target=FARMER`);
                globalCategories = await catRes.json();
            } catch(e) {}

            try {
                const cropRes = await fetch(`${API_BASE_URL}/api/crops/feed`);
                const json = await cropRes.json();
                farmerCrops = (json.data || []).filter(c => c.farmer_phone === currentUser.phone);
                document.getElementById('listingCount').innerText = `${farmerCrops.length} active harvests listed`;
                renderCategories();
            } catch(e) {
                document.getElementById('categoryGrid').innerHTML = `<p class="text-xs text-red-500 italic col-span-2 text-center py-6">Failed to load harvests.</p>`;
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            if (!farmerCrops || farmerCrops.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 bg-green-50 p-6 rounded-3xl text-center border border-green-200">
                        <p class="text-xs font-bold text-green-800 mb-1">No active harvests listed yet.</p>
                        <p class="text-[10px] text-green-600">Click 'New Listing' above to add your produce.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            const categoriesPresent = [...new Set(farmerCrops.map(c => c.product_details?.category || 'Vegetables'))];
            
            categoriesPresent.forEach(catName => {
                const catInfo = globalCategories.find(g => g.name === catName) || { icon: 'fa-seedling' };
                const count = farmerCrops.filter(c => (c.product_details?.category || 'Vegetables') === catName).length;
                
                grid.innerHTML += `
                    <div onclick="openCategoryProducts('${catName}')" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer flex flex-col items-center justify-center text-center">
                        <div class="h-12 w-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-2 shadow-inner"><i class="fas ${catInfo.icon || 'fa-seedling'} text-base"></i></div>
                        <h3 class="font-bold text-gray-800 text-xs">${catName}</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">${count} listings</p>
                    </div>`;
            });
        }

        function openCategoryProducts(categoryName) {
            document.getElementById('categoryGrid').classList.add('hidden');
            document.getElementById('productView').classList.remove('hidden');
            document.getElementById('activeCategoryTitle').innerText = categoryName;

            const grid = document.getElementById('productGrid');
            const matchingCrops = farmerCrops.filter(c => (c.product_details?.category || 'Vegetables') === categoryName);
            
            grid.innerHTML = matchingCrops.map(c => `
                <div class="bg-white p-3.5 rounded-2xl border shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="${c.image_url || 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300&q=80'}" class="h-14 w-14 object-cover rounded-xl">
                        <div>
                            <h4 class="font-bold text-xs text-gray-900">${c.product_details?.crop_name || 'Crop'}</h4>
                            <p class="text-[10px] text-gray-500">Yield: <strong>${c.harvest_data?.total_yield_kg || 0} kg</strong></p>
                            <p class="text-[10px] font-extrabold text-farmgreen">₹${c.pricing?.market_price_per_kg || 0} / kg</p>
                        </div>
                    </div>
                    <button onclick="deleteCrop('${c._id}')" class="text-red-500 hover:text-red-700 p-2 text-xs"><i class="fas fa-trash-alt"></i></button>
                </div>`).join('');
        }

        function showCategories() {
            document.getElementById('productView').classList.add('hidden');
            document.getElementById('categoryGrid').classList.remove('hidden');
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

        async function submitNewListing(e) {
            e.preventDefault();
            const cropName = document.getElementById('cropName').value;
            const fileInput = document.getElementById('cropPhotoFile');
            
            let imageUrl = '';
            if (fileInput.files && fileInput.files[0]) {
                // Convert uploaded file to Base64 data URL for persistence
                imageUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => resolve(uploadEvent.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            } else {
                // AI Image Fallback based on crop name or category
                const query = encodeURIComponent(cropName || 'fresh farm produce vegetables organic');
                imageUrl = `https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=80`;
            }

            const payload = {
                crop_name: cropName,
                category: document.getElementById('listingCategory').value,
                yield_kg: Number(document.getElementById('cropYield').value),
                price: Number(document.getElementById('cropPrice').value),
                estimated_harvest_date: document.getElementById('harvestDate').value,
                image_url: imageUrl,
                farmer_phone: currentUser.phone,
                address_text: currentUser.location_details?.hobli_area || 'Farm Location',
                lat: 12.9716, 
                lng: 77.5946
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/crops/voice-listing`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert("✅ Harvest listed successfully with AI/Gallery Image!");
                    closeAddModal();
                    loadInventoryData();
                } else {
                    alert("❌ Failed to list harvest.");
                }
            } catch(err) {
                alert("❌ Network error.");
            }
        }

        async function deleteCrop(id) {
            if(!confirm("Are you sure you want to delete this listing?")) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/crops/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    loadInventoryData();
                    showCategories();
                } else {
                    alert("Failed to delete.");
                }
            } catch(e) {
                alert("Error connecting to server.");
            }
        }
    </script>
</body>
</html>
