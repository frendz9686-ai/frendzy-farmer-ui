<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy Farmers - Smart Store Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a', farmyellow: '#f59e0b', machblue: '#0284c7' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative pb-16 overflow-hidden flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-farmgreen text-white p-4 rounded-b-3xl shadow-md flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='farmer-dashboard.html'" class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-xl transition">
                    <i class="fas fa-arrow-left text-xs"></i>
                </button>
                <div>
                    <h2 class="font-bold text-base"><i class="fas fa-map-marked-alt mr-1.5"></i>Smart Store Finder</h2>
                    <p class="text-green-100 text-[10px]">Compare local supplier prices & distances</p>
                </div>
            </div>
            <!-- 🌐 Language Switcher -->
            <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-white/20 text-white border border-white/30 rounded-lg px-2 py-1 text-xs font-bold outline-none cursor-pointer">
                <option value="en" class="text-gray-900">EN</option>
                <option value="hi" class="text-gray-900">HI</option>
                <option value="kn" class="text-gray-900">KN</option>
            </select>
        </header>

        <!-- Main Content Container -->
        <div class="p-4 space-y-4">
            
            <!-- Search & Filter Bar -->
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-extrabold text-xs text-gray-900 uppercase">Search Inputs & Supplies</h3>
                <div class="flex gap-2">
                    <input type="text" id="compareQuery" placeholder="Search (e.g. Seeds, Urea, Pesticide)..." class="flex-1 border rounded-2xl p-3 text-xs bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="compareSuppliers()" class="bg-indigo-600 text-white font-bold px-4 py-3 rounded-2xl text-xs shadow-sm hover:bg-indigo-700 transition">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- Comparison Results Container -->
            <div id="comparisonResults" class="space-y-3">
                <p class="text-xs text-gray-400 italic text-center py-8 bg-white rounded-3xl border border-gray-100">Enter an item to compare prices across local suppliers.</p>
            </div>
        </div>

    </div>

    <!-- Application Config & Logic -->
    <script src="./config.js"></script>
    <script>
        const translations = {
            en: { title: "Smart Store Finder" },
            hi: { title: "स्मार्ट स्टोर फाइंडर" },
            kn: { title: "ಸ್ಮಾರ್ಟ್ ಸ್ಟೋರ್ ಫೈಂಡರ್" }
        };

        function changeLanguage(langCode) {
            localStorage.setItem('frendzy_lang', langCode);
            if(document.getElementById('langSwitcher')) document.getElementById('langSwitcher').value = langCode;
        }
        document.addEventListener("DOMContentLoaded", () => { 
            changeLanguage(localStorage.getItem('frendzy_lang') || 'en'); 
            compareSuppliers(); // Load all items by default on open
        });

        let currentUser = JSON.parse(localStorage.getItem('frendzy_user') || 'null');
        if (!currentUser || currentUser.role !== 'FARMER') {
            window.location.href = 'farmer-dashboard.html';
        }

        async function compareSuppliers() {
            const query = (document.getElementById('compareQuery').value || "").toLowerCase().trim();
            const resultsContainer = document.getElementById('comparisonResults');
            
            resultsContainer.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-6">Searching local suppliers...</p>`;

            try {
                const res = await fetch(`${API_BASE_URL}/api/inputs`);
                const items = await res.json();

                const filtered = items.filter(i => 
                    i.product_name.toLowerCase().includes(query) || 
                    (i.category && i.category.toLowerCase().includes(query))
                );

                if (filtered.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="bg-indigo-50 p-6 rounded-3xl text-center border border-indigo-200">
                            <p class="text-xs font-bold text-indigo-900 mb-1">No matching inputs found.</p>
                            <p class="text-[10px] text-indigo-600">Try searching for broader keywords like 'Seeds' or 'Fertilizer'.</p>
                        </div>`;
                    return;
                }

                resultsContainer.innerHTML = filtered.map(item => `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${item.image_url || 'https://images.unsplash.com/photo-1585336261022-6fc4e292a833?w=300&q=80'}" class="h-14 w-14 object-cover rounded-2xl shadow-sm">
                            <div>
                                <h4 class="font-bold text-xs text-gray-900">${item.product_name}</h4>
                                <p class="text-[10px] text-gray-500"><i class="fas fa-store text-purple-600 mr-1"></i> ${item.supplier_name || 'Local Supplier'}</p>
                                <p class="text-[10px] text-indigo-600 font-semibold mt-0.5"><i class="fas fa-map-marker-alt mr-1"></i> Available nearby</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-extrabold text-purple-700">₹${item.price}</p>
                            <p class="text-[9px] text-gray-400">${item.unit_size || '1 Unit'}</p>
                        </div>
                    </div>`).join('');
            } catch (e) {
                resultsContainer.innerHTML = `<p class="text-xs text-red-500 italic text-center py-6">Failed to fetch store comparison data.</p>`;
            }
        }
    </script>
</body>
</html>
